<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Record Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column. Search on top like a search engine, answer directly under it, ranked table below. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#14201a; --muted:#59695f; --line:#d3dcd5;
  --accent:#0b6b3a; --accent-ink:#ffffff; --tint:#e3efe6; --win:#0b6b3a; --loss:#b3261e;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1411; --surface:#151e19; --ink:#e8efe9; --muted:#98a89d; --line:#29372e;
  --accent:#4fd08a; --accent-ink:#06140c; --tint:#1a2a21; --win:#4fd08a; --loss:#ff8a80; --c1:#3987e5; --c2:#d95926; --c3:#199e70; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1411; --surface:#151e19; --ink:#e8efe9; --muted:#98a89d; --line:#29372e;
  --accent:#4fd08a; --accent-ink:#06140c; --tint:#1a2a21; --win:#4fd08a; --loss:#ff8a80; --c1:#3987e5; --c2:#d95926; --c3:#199e70; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-direction:column;gap:4px}
.eyebrow{font:600 13px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(40px,9vw,64px)/.95 var(--display);margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.demo{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:14px}
form{display:flex;gap:8px}
#q{flex:1;min-width:0;font:500 18px/1.2 var(--body);padding:14px 16px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink)}
#q::placeholder{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
#go{font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:0 20px;border:2px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* yard-line ruler: a tick every 10 "yards", the one decoration on the page */
.yards{height:10px;border-top:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 10%)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:14px;color:var(--muted)}
.read{display:flex;flex-wrap:wrap;gap:6px}
.read span{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--tint);color:var(--accent)}
.answer{border-left:6px solid var(--accent);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:4px}
.answer .big{font:700 clamp(34px,8vw,54px)/1 var(--display);text-transform:uppercase;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.answer .sub{color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td.k{font-weight:600}
.w{color:var(--win);font-weight:600}.l{color:var(--loss);font-weight:600}
.small{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0}
footer{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:15px}
.who b{font-weight:600}
.who select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.who button,.linkish{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:14px}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.wk-stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font:600 11px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 26px/1.05 var(--display);font-variant-numeric:tabular-nums;text-transform:uppercase;overflow-wrap:anywhere}
.stat small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.matches{display:flex;flex-direction:column;gap:14px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mtag{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 14px 0}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 14px 12px;border-bottom:1px solid var(--line)}
.mteam{min-width:0}.mteam.r{text-align:right}
.mteam b{display:block;font-weight:600}
.mteam small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.mscore{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.mscore .won{color:var(--win)}.mscore em{font-style:normal;color:var(--muted);padding:0 6px}
.mscore small{display:block;font:500 12px/1.4 var(--body);color:var(--muted)}
.lineups{display:grid;grid-template-columns:1fr 1fr}
.lineups>div{padding:8px 14px 10px;min-width:0}
.lineups>div+div{border-left:1px solid var(--line)}
.lh{font:600 11px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 0 4px}
.lu{list-style:none;margin:0;padding:0;font-size:14px;font-variant-numeric:tabular-nums}
.lu li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.lu li:last-child{border-bottom:0}
.lu .pos{color:var(--muted);font-size:12px;padding-top:2px}
.lu .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu .top{color:var(--win);font-weight:600}
h3.sec{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:10px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px}
.sw.s0,.ln.s0{background:var(--c1);stroke:var(--c1)}.sw.s1,.ln.s1{background:var(--c2);stroke:var(--c2)}.sw.s2,.ln.s2{background:var(--c3);stroke:var(--c3)}
.sw.avg{background:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto}
.chart svg{width:100%;min-width:520px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--muted);font:12px var(--body)}
.chart .ln{stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .avgline{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .dot{stroke:var(--surface);stroke-width:2}.chart .dot.s0{fill:var(--c1)}.chart .dot.s1{fill:var(--c2)}.chart .dot.s2{fill:var(--c3)}
.recap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.recap pre{margin:0;width:100%;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;font:14px/1.55 var(--body)}
.copy{font:700 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border:2px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--bg)}
.banner{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:14px 16px}
.banner .bt{font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.banner .bt small{font:500 13px var(--body);text-transform:none;letter-spacing:0;color:var(--muted);margin-left:8px}
.banner .bs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.banner .bs div{display:flex;flex-direction:column;min-width:0}
.banner .bs span{font:600 11px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.banner .bs b{font:700 24px/1.05 var(--display);font-variant-numeric:tabular-nums}
.banner .bs small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
#home{display:flex;flex-direction:column;gap:12px}
.qwrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden;margin:0;padding:4px 0;list-style:none}
.sugg li{padding:9px 14px;cursor:pointer;font-size:16px}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--tint)}
.sugg li b{font-weight:600}
.fixed{font-size:14px;color:var(--muted)}.fixed b{color:var(--ink)}
.dym{display:flex;flex-direction:column;gap:8px}.dym p{margin:0;font-weight:600}
@media (max-width:600px){.banner .bs{grid-template-columns:1fr}}
details.bench summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0 2px}
@media (max-width:480px){#go{padding:0 14px}.tiles{grid-template-columns:1fr}.lineups{grid-template-columns:1fr}.lineups>div+div{border-left:0;border-top:1px solid var(--line)}.mscore{font-size:22px}}
</style>
<script data-goatcounter="https://themox007.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">Fantasy football record book</span>
    <h1 id="league">League Record Book</h1>
  </header>
  <div class="demo" id="demo" hidden>These are made-up managers and scores so you can try the search. Your league's real history replaces them once the setup steps are done.</div>
  <div class="who" id="who" hidden>
    <label for="whoPick"><b>Who's searching?</b></label>
    <select id="whoPick"><option value="">Pick your name</option></select>
    <button type="button" id="whoSkip">Skip</button>
  </div>
  <div class="qwrap">
  <form id="f" autocomplete="off">
    <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false" placeholder="Ask anything: lowest score in week 5" aria-label="Search the league history">
    <button id="go" type="submit">Search</button>
  </form>
  <ul class="sugg" id="sugg" role="listbox" aria-label="Suggestions" hidden></ul>
  </div>
  <div class="yards" aria-hidden="true"></div>
  <div class="chips" id="chips"></div>
  <section id="home"><div class="tiles" id="tiles"></div></section>
  <section id="out" aria-live="polite" hidden></section>
  <footer><span id="foot"></span><span id="whoNow"></span></footer>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const p2=n=>Number(n).toFixed(2);
let M={},scores=[],games=[],seasons=[],aliases=[],latest={year:0,week:0},pRows=[],plist=[],byLast={};
const norm=s=>s.toLowerCase().replace(/[.'’`\/]/g,'').replace(/[^a-z0-9]+/g,' ').replace(/ (jr|sr|ii|iii|iv|v)$/,'').trim();
const STOP=new Set('week weeks score scores scored point points season seasons year most least lowest highest best worst fewest biggest record average bench benched player players playoff playoffs final finals loss lost wins ever time total game games this last with from have what when many much does that their played start started rank high'.split(' '));
const nm=id=>id&&M[id]?M[id].name:'Unknown';

function build(d){
  M=d.managers||{};seasons=(d.seasons||[]).slice().sort((a,b)=>a.year-b.year);
  const teamNames={};
  for(const s of seasons){
    const tm={};s.teams.forEach(t=>{tm[t.teamId]=t;(teamNames[t.managerId]=teamNames[t.managerId]||new Set()).add(t.name)});
    s.done=s.teams.some(t=>t.finalRank>0);
    for(const g of s.games){
      if(!g.winner||g.winner==='UNDECIDED')continue;
      const sides=[g.home,g.away].filter(x=>x&&tm[x.teamId]);
      if(!sides.length)continue;
      const playoff=g.tier&&g.tier!=='NONE';
      const base={year:s.year,week:g.week,playoff,side:playoff&&g.tier!=='WINNERS_BRACKET'};
      const mk=(x,o)=>({...base,m:tm[x.teamId].managerId,team:tm[x.teamId].name,pts:x.pts,
        opp:o?tm[o.teamId].managerId:null,oppPts:o?o.pts:null,res:o?(x.pts>o.pts?'W':x.pts<o.pts?'L':'T'):null});
      if(sides.length===2){
        const a=mk(sides[0],sides[1]),b=mk(sides[1],sides[0]);scores.push(a,b);
        const hi=a.pts>=b.pts?a:b,lo=hi===a?b:a;
        games.push({...base,hi,lo,margin:hi.pts-lo.pts,total:hi.pts+lo.pts});
      }else scores.push(mk(sides[0],null));
    }
  }
  const P=d.players||{},tot={};
  for(const s of seasons){
    const tm={};s.teams.forEach(t=>tm[t.teamId]=t);
    for(const r of s.playerWeeks||[]){
      const t=tm[r[1]],p=P[r[2]];if(!t||!p)continue;
      pRows.push({year:s.year,week:r[0],m:t.managerId,team:t.name,pid:String(r[2]),name:p[0],pos:p[1],slot:r[3],pts:r[4],proj:r[5]==null?null:r[5]});
      tot[r[2]]=(tot[r[2]]||0)+r[4];
    }
  }
  for(const id in tot){const n=norm(P[id][0]),p={id:String(id),name:P[id][0],norm:n,total:tot[id]};plist.push(p);
    const last=n.split(' ').pop();(byLast[last]=byLast[last]||[]).push(p)}
  for(const k in byLast)byLast[k].sort((a,b)=>b.total-a.total);
  for(const s of scores)if(s.year>latest.year||(s.year===latest.year&&s.week>latest.week))latest={year:s.year,week:s.week};
  const firsts={};
  for(const id in M){const f=M[id].name.toLowerCase().split(' ')[0];firsts[f]=(firsts[f]||0)+1}
  for(const id in M){
    const full=M[id].name.toLowerCase().replace(/\.$/,''),f=full.split(' ')[0];
    aliases.push({id,first:f,re:new RegExp('\\b'+rx(full)+'(?![a-z])')});
    if(firsts[f]===1&&f.length>1)aliases.push({id,first:f,re:new RegExp('\\b'+rx(f)+'\\b')});
    (teamNames[id]||[]).forEach(t=>{if(t.length>3)aliases.push({id,team:true,name:t.toLowerCase(),re:new RegExp(rx(t.toLowerCase()))})});
  }
}

function parse(raw){
  raw=rewrite(fixTypos(rewrite(raw)));
  const q=' '+raw.toLowerCase().replace(/[?!,]/g,' ')+' ',has=r=>r.test(q);
  const sc={year:null,week:null,ms:[],phase:null};
  const y=q.match(/\b(20\d\d)\b/);if(y)sc.year=+y[1];
  else if(has(/this (season|year)|current season|so far/))sc.year=latest.year;
  else if(has(/last (season|year)/))sc.year=latest.year-1;
  const w=q.match(/\b(?:week|wk|round)\s*(\d{1,2})\b/);if(w)sc.week=+w[1];
  else if(has(/(this|last|latest) week|most recent/)){sc.week=latest.week;sc.year=sc.year||latest.year}
  if(has(/playoff|final/))sc.phase='playoffs';else if(has(/regular season/))sc.phase='regular';
  // players first, so a team named after a player doesn't hijack the search
  let qn=' '+norm(raw)+' ';let player=null,others=[];
  aliases.forEach(a=>{if(a.team&&a.re.test(q)){const tn=norm(a.name);if(tn)qn=qn.replace(' '+tn+' ',' ')}});
  const wantLineup=has(/line.?up|roster|squad/);
  const fullHits=wantLineup?[]:plist.filter(p=>qn.includes(' '+p.norm+' ')).sort((a,b)=>b.norm.length-a.norm.length||b.total-a.total);
  if(fullHits.length){player=fullHits[0];others=fullHits.slice(1).filter(p=>p.norm===player.norm)}
  else if(!wantLineup)for(const t of qn.trim().split(' ')){
    if(t.length<4||STOP.has(t)||!byLast[t]||aliases.some(a=>a.first===t))continue;
    player=byLast[t][0];others=byLast[t].slice(1,4);break}
  let qm=q;if(player)player.norm.split(' ').forEach(t=>{qm=qm.replace(new RegExp('\\b'+rx(t)+'\\b','g'),' ')});
  for(const a of aliases)if(!(player&&a.team)&&a.re.test(qm)&&!sc.ms.includes(a.id))sc.ms.push(a.id);
  const low=has(/least|lowest|worst|fewest|\blow\b|bottom|minimum|smallest|\bdud|\bbad|last place/);
  const hi=has(/most|highest|best|\btop\b|biggest|record|maximum/);
  const pos=has(/\bqbs?\b|quarterback/)?'QB':has(/\brbs?\b|running ?back/)?'RB':has(/\bwrs?\b|receiver/)?'WR':has(/\btes?\b|tight ?end/)?'TE':has(/kicker/)?'K':has(/d\/?st\b|defen[cs]e/)?'D/ST':null;
  let kind=null;
  const raw0=raw.toLowerCase().trim();
  if(wantLineup)kind='lineup';
  else if(has(/project|\bbooms?\b|over.?perform|under.?perform|beat (his|their|the) proj/))kind='proj';
  else if(has(/coach|optimal|points? left|left on (the )?bench|best possible|should (have|of) won|would (have|of) won|bench(ed)? points/))kind='coach';
  else if(has(/\brecap\b|write.?up/))kind='recap';
  else if(has(/shame/))kind='shame';
  else if(has(/all.?play|luck(iest|y)? (manager|rating|index)|unluckiest|schedule luck|luck rating|robbed/))kind='allplay';
  else if(has(/\btrades?\b|\btraded\b/))kind='trades';
  else if(has(/pick.?ups?|waiver|\bfaab\b|free agents?|\badds\b|\badded\b/))kind='pickups';
  else if(has(/\bdraft(ed|s)?\b|\bpicks?\b|\bsteals?\b|\bbusts?\b/))kind='draft';
  else if(has(/chart|graph|\bplot\b|trend/))kind='chart';
  else if(/^(season\s*)?20\d\d(\s*(season|recap|review|summary|overview))?$/.test(raw0))kind='season';
  else if(player)kind='player';
  else if(has(/bench/))kind='bench';
  else if(pos||has(/\bplayers?\b/))kind='pboard';
  else if(sc.week&&!sc.ms.length&&has(/matchups?|results|scoreboard|everything|all games/))kind='week';
  else if(sc.ms.length>=2)kind='h2h';
  else if(has(/champ|title|trophy|premiership|who won|won the league|winners?\b/)&&!has(/streak/))kind='champs';
  else if(has(/blowout|biggest (win|loss|margin)|largest margin|smash|thrash|flogging/))kind='blowout';
  else if(has(/closest|narrowest|tightest|nail.?biter|smallest margin/))kind='closest';
  else if(has(/streak|in a row/))kind=has(/los/)?'lstreak':'wstreak';
  else if(has(/unluck|in a loss|and lost|lost with|losing score/))kind='unlucky';
  else if(has(/luck|in a win|and won|won with|winning score/))kind='lucky';
  else if(has(/shootout|combined|highest.scoring (game|matchup)/))kind='shootout';
  else if(has(/(in|for|over) a (single |whole |full )?season|season totals?|per season/))kind='seasonpts';
  else if(has(/av[ea]?r[a-z]*g|\bavg\b|\bave\b|per game|\bppg\b|\bmean\b|on average/))kind='avg';
  else if(has(/total points|points for|career points|all.?time points/))kind='totalpts';
  else if(has(/standing|record\b|\bwins?\b|loss(es)?\b|ladder|\btable\b|rank|win (percentage|%|rate)/)&&!has(/score/))kind='standings';
  else if(low)kind='low';
  else if(has(/most|highest|best|\btop\b|biggest|record|point|score/))kind='high';
  else if(sc.ms.length===1)kind='profile';
  else if(sc.week)kind='week';
  return {kind,sc,low,hi,pos,player,others};
}
const lineup=r=>r.slot===1?'Started':r.slot===2?'On IR':'Bench';

    return {labels:lab,big:lead,sub:l.length+' games · '+nm(a)+' averages '+p2(sum(l,s=>s.pts)/l.length)+', '+nm(b)+' averages '+p2(sum(l,s=>s.oppPts)/l.length),
      cols:['When',nm(a)+':n',nm(b)+':n','Winner'],rows:l.map(s=>[when(s),p2(s.pts),p2(s.oppPts),{k:s.res==='W'?nm(a):s.res==='L'?nm(b):'Tie'}])};
  }
  if(kind==='profile'){
    const m=sc.ms[0],l=scores.filter(s=>!s.side&&s.m===m),reg=l.filter(s=>!s.playoff&&s.res);
    if(!l.length)return none;
    const w=reg.filter(s=>s.res==='W').length,ls=reg.filter(s=>s.res==='L').length,srt=l.slice().sort((a,b)=>a.pts-b.pts);
    const rows=seasons.map(s=>{const t=s.teams.find(t=>t.managerId===m);return t&&[s.year,{k:t.name},t.wins+'–'+t.losses,p2(t.pf),t.finalRank?(t.finalRank===1?'Champion':'#'+t.finalRank):'In progress']}).filter(Boolean).reverse();
    const titles=seasons.filter(s=>s.teams.some(t=>t.managerId===m&&t.finalRank===1)).length;
    const lasts=seasons.filter(s=>s.done&&s.teams.slice().sort((a,b)=>b.finalRank-a.finalRank)[0].managerId===m).length;
    const ap=allPlay({}).find(o=>o.m===m),tws=teamWeeks().filter(t=>t.m===m),rate=tws.length?sum(tws,t=>t.act)/sum(tws,t=>t.best):null;
    const vb=group(l.filter(s=>s.opp&&s.res),s=>s.opp),vr=Object.keys(vb).map(o=>{const a=vb[o];return {o,n:a.length,w:a.filter(s=>s.res==='W').length,l:a.filter(s=>s.res==='L').length,pf:sum(a,s=>s.pts)/a.length,pa:sum(a,s=>s.oppPts)/a.length}}).sort((a,b)=>(b.w-b.l)-(a.w-a.l)||b.n-a.n);
    const nem=vr.filter(r=>r.n>=3).sort((a,b)=>(a.w-a.l)-(b.w-b.l))[0];
    const fav=Object.values(group(pRows.filter(r=>r.m===m&&r.slot===1),r=>r.pid)).map(a=>({name:a[0].name,pos:a[0].pos,n:a.length,pts:sum(a,r=>r.pts)})).sort((a,b)=>b.n-a.n||b.pts-a.pts).slice(0,8);
    const pre='<div class="wk-stats">'+stat('Record',w+'–'+ls,'Regular season, all time')+stat('Titles',String(titles),lasts+(lasts===1?' last place':' last places'))+
      stat('Average',p2(sum(l,s=>s.pts)/l.length),'Best '+p2(srt[srt.length-1].pts)+' · worst '+p2(srt[0].pts))+
      (ap?stat('Luck',sgn(ap.luck)+' wins','All-play '+pct(ap.ap)):'')+(rate?stat('Coach rating',pct(rate),p2(sum(tws,t=>t.best-t.act))+' left on the bench'):'')+
      (nem?stat('Nemesis',nm(nem.o),nem.w+'–'+nem.l+' against him'):'')+'</div>';
    let h=sec('Against every manager',tableHtml(['Opponent','W:n','L:n','Scored:n','Conceded:n'],vr.map(r=>[{k:nm(r.o)},r.w,r.l,p2(r.pf),p2(r.pa)])));
    if(fav.length)h+=sec('Favourite players',tableHtml(['Player','Pos','Weeks started:n','Points:n'],fav.map(f=>[{k:f.name},f.pos,f.n,p2(f.pts)])));
    h+=sec('Best weeks',tableHtml(['Points:n','When','Result'],srt.slice(-5).reverse().map(s=>[p2(s.pts),when(s),{html:s.opp?res(s.res)+' vs '+esc(nm(s.opp)):''}])));
    h+=sec('Worst weeks',tableHtml(['Points:n','When','Result'],srt.slice(0,5).map(s=>[p2(s.pts),when(s),{html:s.opp?res(s.res)+' vs '+esc(nm(s.opp)):''}])));
    return {labels:['Manager','All time'],big:nm(m)+' · '+w+'–'+ls,sub:titles+(titles===1?' title':' titles')+' · '+rows.length+' seasons'+(nem?' · nemesis: '+nm(nem.o):''),
      pre,cols:['Season','Team','Record','Points:n','Finish'],rows,html:h};
  }
}

function render(r){
  let h='<div style="display:flex;flex-direction:column;gap:16px"><div class="read">'+r.labels.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'+
    '<div class="answer"><div class="big">'+esc(r.big)+'</div><div class="sub">'+esc(r.sub)+'</div></div>';
  if(r.pre)h+=r.pre;
  if(r.rows&&r.rows.length){
    const cols=r.cols.map(c=>({t:c.replace(/:n$/,''),n:/:n$/.test(c)}));
    h+='<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th'+(c.n?' class="n"':'')+'>'+esc(c.t)+'</th>').join('')+'</tr></thead><tbody>'+
      r.rows.map(row=>'<tr>'+row.map((c,i)=>{const cl=cols[i].n?'n':'';
        if(c&&c.html)return '<td>'+c.html+'</td>';
        if(c&&c.k!==undefined)return '<td class="k '+cl+'">'+esc(c.k)+(c.small?' <span class="small">'+esc(c.small)+'</span>':'')+'</td>';
        return '<td class="'+cl+'">'+esc(c)+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  if(r.html)h+=r.html;
  if(r.note)h+='<p class="note">'+esc(r.note)+'</p>';
  return h+'</div>';
}
// Visit and search tracking (GoatCounter). Names come from the "Who's searching?" picker.
let who='';
try{who=localStorage.getItem('who')||''}catch(e){}
function track(path,title){
  let tries=0;
  (function send(){
    if(window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count({path:path.slice(0,200),title:title||path,event:true})}catch(e){}}
    else if(tries++<20)setTimeout(send,500);
  })();
}
function showWho(){
  $('#who').hidden=!!who;
  $('#whoNow').innerHTML=who&&who!=='skip'?'Searching as '+esc(who)+' · <button type="button" class="linkish" id="whoChange">not you?</button>':'';
}
function setWho(v){
  who=v;try{localStorage.setItem('who',v)}catch(e){}
  if(v&&v!=='skip')track('visit: '+v);
  showWho();
}
function showSugg(v){
  const box=$('#sugg'),list=suggest(v,8);
  if(!list.length||(list.length===1&&list[0]===v.trim().toLowerCase())){hideSugg();return}
  const t=norm(v).split(' ').filter(Boolean);
  box.innerHTML=list.map((x,i)=>'<li role="option" id="sg'+i+'" aria-selected="false" data-q="'+esc(x)+'">'+
    esc(x).split(' ').map(w=>t.some(k=>w.toLowerCase().startsWith(k))?'<b>'+w+'</b>':w).join(' ')+'</li>').join('');
  box.hidden=false;$('#q').setAttribute('aria-expanded','true');
}
function hideSugg(){const b=$('#sugg');if(b){b.hidden=true;b.innerHTML=''}const q=$('#q');if(q){q.setAttribute('aria-expanded','false');q.removeAttribute('aria-activedescendant')}}
function run(q){
  q=q.trim();$('#q').value=q;
  if(!q){$('#out').hidden=true;$('#home').hidden=false;return}
  track((who&&who!=='skip'?who:'Someone')+' searched: '+q.toLowerCase());
  let r=answer(q),shown=q;
  if(r.miss){const fx=fixTypos(rewrite(q));if(fx!==rewrite(q)){const r2=answer(fx);if(!r2.miss){r=r2;shown=fx}}}
  let pre='';
  if(shown!==q)pre='<p class="fixed">Showing results for <b>'+esc(shown)+'</b></p>';
  if(r.miss){const sg=suggest(fixTypos(rewrite(q)),6);const alt=sg.length?sg:suggest('',6);
    pre+='<div class="dym"><p>Did you mean:</p><div class="chips">'+alt.map(x=>'<button type="button" class="chip" data-q="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div></div>'}
  hideSugg();
  $('#out').innerHTML=pre+render(r);$('#out').hidden=false;$('#home').hidden=true;
}
function start(d){
  PL=d.players||{};
  build(d);
  const name=d.league&&d.league.name&&d.league.name.trim();if(name){$('#league').textContent=name;if(!d.demo)document.title=name+' Record Book'}
  $('#demo').hidden=!d.demo;
  const ids=Object.keys(M),a=ids[0]?nm(ids[0]):'',b=ids[1]?nm(ids[1]):'';
  const ex=['lowest score in week 5','highest score this season','biggest blowout ever','closest game '+latest.year,'all-time standings','who won the league','longest winning streak','most points in a season','highest score in a loss'];
  if(a&&b)ex.push(a.split(' ')[0]+' vs '+b.split(' ')[0]);
  if(pRows.length){const top=pRows.reduce((x,r)=>r.pts>x.pts?r:x);
    ex.push('week '+latest.week+' '+latest.year,'recap','hall of shame','coach rating','luckiest manager',(latest.year-1)+' season');
    if(a)ex.push(a.split(' ')[0].toLowerCase()+' lineup week '+latest.week+' '+latest.year);
    ex.push(top.name.toLowerCase()+' week '+top.week+' '+top.year,'highest player score ever','best QB score this season','biggest bench score');
    $('#q').placeholder='Ask anything: lowest score in week 5, or a player and a week'}
  $('#chips').innerHTML=ex.map(x=>'<button type="button" class="chip" data-q="'+esc(x)+'">'+esc(x)+'</button>').join('');
  const tiles=[['All-time lowest score','lowest score ever'],['All-time highest score','highest score ever'],['Biggest blowout','biggest blowout ever'],['Most championships','who won the league']];
  $('#tiles').innerHTML=tiles.map(([t,q])=>{const r=answer(q);const parts=r.big.split(' · ');
    return '<button type="button" class="tile" data-q="'+esc(q)+'"><span>'+esc(t)+'</span><b>'+esc(parts[1]||parts[0])+'</b><span>'+esc(parts[1]?parts[0]:r.sub)+'</span></button>'}).join('');
  if(latest.year){const yr=latest.year,wk=latest.week,sl=scores.filter(s=>s.year===yr&&s.week===wk&&!s.side&&s.opp);
    if(sl.length){const hiS=sl.reduce((a,b)=>b.pts>a.pts?b:a),loS=sl.reduce((a,b)=>b.pts<a.pts?b:a),bp=pRows.filter(r=>r.year===yr&&r.week===wk&&r.slot===0).sort((a,b)=>b.pts-a.pts)[0];
      const it=(t,v,x)=>'<div><span>'+esc(t)+'</span><b>'+esc(v)+'</b><small>'+esc(x)+'</small></div>';
      $('#home').insertAdjacentHTML('afterbegin','<button type="button" class="banner" data-q="week '+wk+' '+yr+'"><div class="bt">Week '+wk+', '+yr+'<small>tap for every matchup</small></div><div class="bs">'+
        it('Top score',p2(hiS.pts),nm(hiS.m))+it('Wooden spoon',p2(loS.pts),nm(loS.m))+(bp?it('Bench blunder',p2(bp.pts),bp.name+' benched by '+nm(bp.m)):'')+'</div></button>')}}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const el=document.getElementById(b.dataset.copy);
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, press copy'};
    try{navigator.clipboard.writeText(el.textContent).then(()=>{b.textContent='Copied'},sel)}catch(x){sel()}});
  const dt=d.updated?new Date(d.updated):null;
  $('#foot').textContent=seasons.length+' seasons ('+seasons[0].year+' to '+seasons[seasons.length-1].year+'), '+games.length+' finished games'+(pRows.length?', '+pRows.length.toLocaleString()+' player scores':'')+(dt&&!isNaN(dt)?' · updated '+dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'');
  const cur=seasons[seasons.length-1],names=[...new Set(cur.teams.map(t=>nm(t.managerId)))].sort();
  $('#whoPick').innerHTML='<option value="">Pick your name</option>'+names.map(n=>'<option>'+esc(n)+'</option>').join('');
  $('#whoPick').addEventListener('change',e=>{if(e.target.value)setWho(e.target.value)});
  $('#whoSkip').addEventListener('click',()=>setWho('skip'));
  document.addEventListener('click',e=>{if(e.target.id==='whoChange'){who='';try{localStorage.removeItem('who')}catch(x){}showWho();$('#whoPick').value=''}});
  if(who&&who!=='skip')track('visit: '+who);
  showWho();
  document.addEventListener('click',e=>{const t=e.target.closest('[data-q]');if(t){run(t.dataset.q);window.scrollTo({top:0})}});
  $('#f').addEventListener('submit',e=>{e.preventDefault();const a=$('#sugg li[aria-selected="true"]');run(a?a.dataset.q:$('#q').value)});
  const box=$('#sugg'),inp=$('#q');
  inp.addEventListener('input',()=>showSugg(inp.value));
  inp.addEventListener('focus',()=>showSugg(inp.value));
  inp.addEventListener('blur',()=>setTimeout(hideSugg,150));
  inp.addEventListener('keydown',e=>{if(box.hidden)return;const items=[...box.children];if(!items.length)return;
    let i=items.findIndex(li=>li.getAttribute('aria-selected')==='true');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();i=e.key==='ArrowDown'?(i+1)%items.length:(i<=0?items.length-1:i-1);
      items.forEach((li,k)=>li.setAttribute('aria-selected',k===i?'true':'false'));inp.setAttribute('aria-activedescendant',items[i].id)}
    else if(e.key==='Escape')hideSugg()});
  box.addEventListener('mousedown',e=>e.preventDefault());
  $('#q').addEventListener('input',e=>{if(!e.target.value.trim())run('')});
}
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(start).catch(()=>{
  $('#home').innerHTML='<p class="note">The league data file (data.json) could not be loaded. Check that it sits next to this page.</p>'});
})();
</script>
